<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Shayan Mustafa — Data &amp; AI engineer. Stack: Python, C#, JavaScript, AWS, Terraform, Snowflake, Databricks, dbt, Airflow">
  <style>
